<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Datos de envío</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body style="background-color: #E1D5C6;">

    <!-- Menú de navegación -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">

            <a class="navbar-brand" href="menu.html">
                Adopta a tu piedra.
            </a>

            <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#menuPrincipal"
                aria-controls="menuPrincipal"
                aria-expanded="false"
                aria-label="Abrir menú">

                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menuPrincipal">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="menu.html">Inicio</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="piedras.html">Piedras</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">Contacto</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Formulario -->
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">

                <div class="card p-4" style="background-color: #E1D5C6;">

                    <h1 class="text-center mb-3">Datos de envío</h1>

                    <p class="text-center">
                        Rellena tus datos para recibir tu piedra en casa.
                    </p>

                    <form id="formulario">

                        <h5 class="mt-3 mb-3">Tus datos</h5>

                        <div class="mb-3">
                            <label for="nombre" class="form-label">
                                Nombre y apellidos
                            </label>
                            <input type="text" class="form-control"
                                id="nombre" required>
                        </div>

                        <div class="mb-3">
                            <label for="correo" class="form-label">
                                Correo electrónico
                            </label>
                            <input type="email" class="form-control"
                                id="correo" required>
                        </div>

                        <h5 class="mt-4 mb-3">Dirección de envío</h5>

                        <div class="mb-3">
                            <label for="direccion" class="form-label">
                                Calle y número
                            </label>
                            <input type="text" class="form-control"
                                id="direccion" required>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="ciudad" class="form-label">
                                    Ciudad
                                </label>
                                <input type="text" class="form-control"
                                    id="ciudad" required>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label for="codigoPostal" class="form-label">
                                    Código postal
                                </label>
                                <input type="text" class="form-control"
                                    id="codigoPostal" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="provincia" class="form-label">
                                Provincia
                            </label>
                            <input type="text" class="form-control"
                                id="provincia" required>
                        </div>

                        <div class="mb-3">
                            <label for="pais" class="form-label">
                                País
                            </label>
                            <input type="text" class="form-control"
                                id="pais" value="España" required>
                        </div>

                        <h5 class="mt-4 mb-3">Método de pago</h5>

                        <div class="form-check border rounded p-3 ps-5">
                            <input class="form-check-input" type="radio"
                                name="pago" id="tarjeta"
                                value="Tarjeta bancaria" checked>

                            <label class="form-check-label" for="tarjeta">
                                Tarjeta bancaria 💳
                            </label>
                        </div>

                        <button type="submit" class="btn btn-dark w-100 mt-4">
                            Confirmar pedido
                        </button>

                        <p id="mensaje" class="text-center mt-3"></p>

                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript de Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        document.getElementById("formulario").addEventListener("submit", function(event) {
            event.preventDefault();

            document.getElementById("mensaje").textContent =
                "¡Datos completados! Ahora falta conectar el pago seguro con tarjeta.";
        });
    </script>

</body>
</html>
